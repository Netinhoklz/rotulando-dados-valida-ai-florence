<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotulador UNIDOCK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%232a62b8%22/%3E%3Cpath d=%22M4 4h8M4 8h5M4 12h7%22 stroke=%22white%22 stroke-width=%221.6%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}">
</head>
<body class="pagina-editor">
<header id="topo">
  <h1 class="marca" title="Rotulador UNIDOCK"><span class="logo" data-ico="logo" data-tam="18"></span><span class="visualmente-oculto">Rotulador UNIDOCK</span></h1>
  <nav id="menus" class="menus" role="menubar" aria-label="Menus"></nav>
  <nav id="abas-split" aria-label="Split"></nav>
  <div class="espaco"></div>
  <div class="modos">
    <button id="btn-lote" class="discreto" data-ico="fabrica" title="Gerador automático: escolha documentos, técnicas e classes e gere em lote (abre em outra aba)"><span>Gerador</span></button>
    <span id="lote-pill" class="pilula" hidden></span>
    <button id="btn-ajuda" class="so-icone" data-ico="ajuda" title="Como editar" aria-label="Como editar"></button>
    <button id="btn-glossario" class="so-icone" data-ico="livro" title="O que é cada coisa (classe, camada, máscara, técnica…)" aria-label="Glossário"></button>
    <button id="btn-atalhos" class="so-icone" data-ico="teclado" title="Atalhos de teclado (?)" aria-label="Atalhos de teclado"></button>
  </div>
  <div class="saida">
    <label title="Original e editada sempre saem no mesmo formato e qualidade">Saída
      <select id="formato"></select>
    </label>
    <label id="rot-qualidade">Qualidade <input id="qualidade" type="number" min="1" max="100" value="95"></label>
    <label title="Seu nome (vai nas versões que você salvar e nas revisões)"><span class="visualmente-oculto">Operador</span>
      <input id="operador" type="text" maxlength="80" placeholder="seu nome"></label>
    <button id="btn-descartar" class="perigo" title="Descarta todas as edições deste documento">Descartar</button>
    <button id="btn-salvar" class="primario" data-ico="salvar" disabled title=""><span>Salvar</span></button>
  </div>
</header>

<div id="opcoes">
  <div id="ferr-atual" class="ferr-atual"></div>
  <div id="opcoes-ferramenta"></div>
  <div class="zoom-ctl" role="group" aria-label="Zoom">
    <button id="zoom-menos" title="Afastar (Ctrl+−)" aria-label="Afastar">−</button>
    <button id="zoom-val" title="Tamanho real (1)">100%</button>
    <button id="zoom-mais" title="Aproximar (Ctrl++)" aria-label="Aproximar">+</button>
    <button id="zoom-ajustar" title="Caber na tela (Ctrl+0)">Ajustar</button>
  </div>
</div>

<main>
  <aside id="ferramentas" aria-label="Ferramentas"></aside>

  <section id="area-doc" class="painel-g">
    <div class="abas-painel">
      <div class="navdoc">
        <button id="doc-ant" class="so-icone" data-ico="anterior" title="Imagem anterior (PageUp)" aria-label="Imagem anterior"></button>
        <span class="aba ativa"><span id="doc-nome" title="">nenhum documento</span></span>
        <button id="doc-prox" class="so-icone" data-ico="proximo" title="Próxima imagem (PageDown)" aria-label="Próxima imagem"></button>
        <span id="doc-versoes" class="pilula"></span>
      </div>
    </div>
    <section id="visor" tabindex="0">
      <canvas id="tela"></canvas>
      <div id="vazio">Nenhuma imagem neste split.</div>
      <div id="barra-contexto" class="barra-contexto" role="toolbar" aria-label="Ações na seleção" hidden></div>
      <div id="ocupado" hidden><div class="giro"></div><span id="ocupado-msg">processando…</span>
        <span id="ocupado-ia" class="dica"></span>
        <button type="button" id="ocupado-cancelar" hidden title="Para a IA no próximo passo">Cancelar</button></div>
      <div id="banner-trava" class="banner-trava" role="alert" hidden>
        <span id="banner-trava-txt"></span>
        <button type="button" id="btn-assumir" class="primario">Assumir edição</button>
      </div>
    </section>
  </section>

  <aside id="painel">
    <section id="sec-tipo" class="painel-g">
      <h2 class="abas-painel"><span class="aba ativa"><span data-termo="classe">Tipo da edição</span></span>
        <small>escolha antes de editar</small></h2>
      <div class="corpo">
        <ul id="lista-categorias" class="tipos" role="radiogroup" aria-label="Tipo da edição"></ul>
        <p id="motivo-salvar" class="dica"></p>
      </div>
    </section>
    <section id="sec-camadas" class="painel-g">
      <h2 class="abas-painel"><span class="aba ativa"><span data-termo="camada">Camadas</span></span></h2>
      <div class="corpo">
        <div id="cam-opacidade" class="linha-opac" hidden>
          <label for="cam-opac">Opacidade</label>
          <input id="cam-opac" type="range" min="0" max="100" step="1">
          <span id="cam-opac-val"></span>
        </div>
        <ul id="lista-camadas"></ul>
        <p id="cam-dica" class="dica"></p>
      </div>
      <div class="rodape-painel acoes">
        <button id="cam-nova" class="so-icone" data-ico="mais" title="Nova camada (Ctrl+Shift+N)" aria-label="Nova camada"></button>
        <button id="cam-dup" class="so-icone" data-ico="duplicar" title="Duplicar camada (Ctrl+J)" aria-label="Duplicar camada"></button>
        <button id="cam-mesclar" class="so-icone" data-ico="mesclar" title="Mesclar com a de baixo (Ctrl+E)" aria-label="Mesclar com a de baixo"></button>
        <button id="cam-excluir" class="so-icone" data-ico="lixeira" title="Excluir camada" aria-label="Excluir camada"></button>
      </div>
    </section>
    <section id="sec-historico" class="painel-g cresce">
      <h2 class="abas-painel"><span class="aba ativa">Histórico</span>
        <span class="acoes">
          <button id="btn-desfazer" class="so-icone" data-ico="desfazer" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"></button>
          <button id="btn-refazer" class="so-icone" data-ico="refazer" title="Refazer (Ctrl+Shift+Z / Ctrl+Y)" aria-label="Refazer"></button>
        </span>
      </h2>
      <div class="corpo"><ol id="historico"></ol></div>
    </section>
  </aside>
</main>

<footer id="rodape">
  <div id="dicas" class="dicas" aria-label="O que o mouse e o teclado fazem agora"></div>
  <span id="st-msg"></span>
  <span id="st-fila"></span>
  <span id="st-sel"></span>
  <span id="st-pos"></span>
  <span id="st-zoom">100%</span>
  <button id="btn-original" data-ico="original" data-tam="14" title="Segure \ para ver o original"><span>Original</span></button>
  <button id="btn-mascara" data-ico="mascara" data-tam="14" title="Mostrar pixels alterados (K)"><span>Máscara</span></button>
</footer>

<dialog id="modal">
  <form method="dialog" id="modal-form">
    <h3 id="modal-titulo"></h3>
    <div id="modal-corpo"></div>
    <div id="modal-erro" role="alert"></div>
    <div class="modal-acoes" id="modal-acoes"></div>
  </form>
</dialog>

<div id="avisos" role="status"></div>

<script type="module" src="{{ url_for('static', filename='editor.js') }}"></script>
</body>
</html>
